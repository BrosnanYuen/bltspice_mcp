[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bltspice-mcp"
version = "0.3.4"
description = "Create ltspice circuits with LLMs. Convert netlist to LTSpice .asc."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyLTSpice>=6.0.1",
  "fastmcp==2.14.7",
  "electronics-design>=0.2.3",
  "psutil>=7.2.2",
]

[project.optional-dependencies]
test = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
